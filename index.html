<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mus Master</title>
    <style>
        :root {
            --bg-color: #1b5e20;
            --panel-bg: rgba(0,0,0,0.3);
            --team-a: #42a5f5;
            --team-b: #ffca28;
            --accent: #ffeb3b;
            --text: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Alineado arriba para dar espacio a los sub-marcadores */
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            height: 18vh;
            min-height: 110px;
        }
        
        .global-score-box {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 40%;
        }
        
        .score-num { font-size: 2.8rem; font-weight: bold; min-width: 50px; text-align: center; line-height: 1;}
        
        .team-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .team-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            cursor: text;
            margin-bottom: 5px;
        }

        /* Contadores de Vacas y Juegos */
        .sub-scores {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .sub-badge {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Area de fichas visuales */
        .tokens-area {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
            height: 24px;
        }
        
        .token { width: 14px; height: 14px; border-radius: 50%; box-shadow: 1px 1px 2px black; }
        .token.amarraco { background: gold; border: 2px solid #b8860b; width: 18px; height: 18px; }
        .token.piedra { background: white; border: 1px solid #999; }

        /* Botón de Ajustes Central 
            font-size: 1.5rem;
            opacity: 0.7;
            cursor: pointer;
            padding: 10px;
            margin-top: 5px;
        }*/

        /* MAIN: Tablero de Control */
        .main-board {
            flex: 1;
            display: grid;
            grid-template-columns: 80px 1fr 80px; 
            gap: 5px;
            padding: 5px;
        }

        /* Columnas laterales */
        .side-panel { display: flex; flex-direction: column; justify-content: space-around; }

        .btn-manual {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            height: 18%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-manual:active { background: rgba(255,255,255,0.4); }

        /* Columna Central */
        .phases-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 5px;
        }

        .phase-row {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            height: 23%;
            padding: 0 5px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .phase-row.active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent);
        }

        .phase-name { font-size: 0.9rem; width: 60px; font-weight: 600; opacity: 0.8; }
        .phase-pot { flex: 1; text-align: center; font-size: 2rem; color: var(--accent); font-weight: bold; }
        .btn-award { background: none; border: none; color: white; font-size: 1.5rem; padding: 0 15px; cursor: pointer; opacity: 0.6; }

        /* FOOTER PARA MÓVIL */
        .betting-controls {
            height: auto; 
            min-height: 18vh;
            background: rgba(0,0,0,0.9);
            
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            
            border-top: 2px solid var(--accent);
            /* Importante para iPhone X y móviles modernos (zona segura abajo) */
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .bet-btn {
            background: #3e2723;
            color: var(--accent);
            border: 1px solid var(--accent);
            
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
            max-width: none;
        }
        
        .bet-btn:active {
            background: var(--accent);
            color: black;
            transform: scale(0.98);
        }

        /* Estilos específicos para botones especiales */
        .btn-borrar {
            background: #5d4037; 
            color: #ffcccb; 
            border-color: #8d6e63;
            font-size: 1rem;
        }
        
        .btn-ordago {
            grid-column: span 2;
            background: linear-gradient(45deg, #b71c1c, #d32f2f);
            color: white;
            border: 2px solid red;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MODALES (Ajustes y Victoria) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: #263238;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #546e7a;
        }

        .modal h2 { margin-top: 0; color: var(--accent); }
        
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .config-input {
            width: 60px;
            padding: 5px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 5px;
            border: none;
        }

        .btn-modal {
            background: var(--team-a);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }

        .victory-text { font-size: 2rem; margin-bottom: 20px; font-weight: bold; color: var(--accent); }
        .sub-victory-text { font-size: 1.2rem; color: white; margin-bottom: 30px; }

    </style>
</head>
<body>

    <header class="header">
        <div class="global-score-box" style="flex-direction: row;">
            <div class="score-num" style="color: var(--team-a);" id="scoreA">0</div>
            
            <div class="team-info" style="align-items: flex-start;">
                <div class="team-title" style="color: var(--team-a);" contenteditable="true" spellcheck="false" id="nameA">XYM</div>
                <div class="sub-scores">
                    <div class="sub-badge" style="border: 1px solid var(--team-a);">🏆 <span id="vacasA">0</span></div>
                    <div class="sub-badge" style="border: 1px solid var(--team-a);">🎮 <span id="gamesA">0</span></div>
                </div>
                <div class="tokens-area" id="tokensA" style="justify-content: flex-start;"></div>
            </div>
        </div>

        <div style="display: flex; gap: 15px; font-size: 1.5rem; margin-top: 5px;">
            <div style="opacity: 0.7; cursor: pointer;" onclick="loadRanking()">🏆</div>
            <div style="opacity: 0.7; cursor: pointer;" onclick="openSettings()">⚙️</div>
        </div>

        <div class="global-score-box" style="flex-direction: row-reverse; text-align: right;">
            <div class="score-num" style="color: var(--team-b);" id="scoreB">0</div>
            <div class="team-info" style="align-items: flex-end;">
                <div class="team-title" style="color: var(--team-b);" contenteditable="true" spellcheck="false" id="nameB">MAHO</div>
                <div class="sub-scores">
                    <div class="sub-badge" style="border: 1px solid var(--team-b);">🎮 <span id="gamesB">0</span></div>
                    <div class="sub-badge" style="border: 1px solid var(--team-b);">🏆 <span id="vacasB">0</span></div>
                </div>
                <div class="tokens-area" id="tokensB" style="justify-content: flex-end;"></div>
            </div>
        </div>
    </header>

    <div class="main-board">
        <div class="side-panel">
            <button class="btn-manual" style="border-color: var(--team-a); color: var(--team-a);" onclick="manualAdd('A', 1)">+1</button>
            <button class="btn-manual" style="border-color: var(--team-a); color: var(--team-a);" onclick="manualAdd('A', 2)">+2</button>
            <button class="btn-manual" style="border-color: var(--team-a); color: var(--team-a);" onclick="manualAdd('A', 3)">+3</button>
            <button class="btn-manual" style="border-color: #ef5350; color: #ef5350;" onclick="manualAdd('A', -1)">-1</button>
        </div>

        <div class="phases-container">
            <div class="phase-row active" onclick="selectPhase(0)" id="row0">
                <button class="btn-award" onclick="awardPot(0, 'A', event)">◀</button>
                <div class="phase-name">GRA</div>
                <div class="phase-pot" id="pot0">0</div>
                <button class="btn-award" onclick="awardPot(0, 'B', event)">▶</button>
            </div>
            <div class="phase-row" onclick="selectPhase(1)" id="row1">
                <button class="btn-award" onclick="awardPot(1, 'A', event)">◀</button>
                <div class="phase-name">CHI</div>
                <div class="phase-pot" id="pot1">0</div>
                <button class="btn-award" onclick="awardPot(1, 'B', event)">▶</button>
            </div>
            <div class="phase-row" onclick="selectPhase(2)" id="row2">
                <button class="btn-award" onclick="awardPot(2, 'A', event)">◀</button>
                <div class="phase-name">PAR</div>
                <div class="phase-pot" id="pot2">0</div>
                <button class="btn-award" onclick="awardPot(2, 'B', event)">▶</button>
            </div>
            <div class="phase-row" onclick="selectPhase(3)" id="row3">
                <button class="btn-award" onclick="awardPot(3, 'A', event)">◀</button>
                <div class="phase-name">JUE</div>
                <div class="phase-pot" id="pot3">0</div>
                <button class="btn-award" onclick="awardPot(3, 'B', event)">▶</button>
            </div>
        </div>

        <div class="side-panel">
            <button class="btn-manual" style="border-color: var(--team-b); color: var(--team-b);" onclick="manualAdd('B', 1)">+1</button>
            <button class="btn-manual" style="border-color: var(--team-b); color: var(--team-b);" onclick="manualAdd('B', 2)">+2</button>
            <button class="btn-manual" style="border-color: var(--team-b); color: var(--team-b);" onclick="manualAdd('B', 3)">+3</button>
            <button class="btn-manual" style="border-color: #ef5350; color: #ef5350;" onclick="manualAdd('B', -1)">-1</button>
        </div>
    </div>

    <div class="betting-controls">
        <button class="bet-btn" onclick="addToActivePot(1)">+1</button>
        <button class="bet-btn" onclick="addToActivePot(2)">Envido</button>
        <button class="bet-btn" onclick="addToActivePot(5)">+5</button>
        
        <button class="bet-btn btn-borrar" onclick="addToActivePot(-100)">Borrar</button>
        <button class="bet-btn btn-ordago" onclick="addToActivePot(40)">ÓRDAGO</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Configuración</h2>
            
            <div class="config-row">
                <span>Piedras por Juego:</span>
                <select id="confLimit" class="config-input">
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select>
            </div>

            <div class="config-row">
                <span>Juegos por Vaca:</span>
                <input type="number" id="confGames" class="config-input" value="2" min="1">
            </div>
            <div style="font-size:0.8rem; color:#aaa; margin-top:-10px; margin-bottom:15px;">("Al mejor de 3" = Pon 2)</div>

            <div class="config-row">
                <span>Vacas para Ganar:</span>
                <input type="number" id="confVacas" class="config-input" value="1" min="1">
            </div>

            <button class="btn-modal" onclick="saveSettings()">Guardar y Reiniciar</button>
            <button style="background:transparent; border:none; color:#aaa; margin-top:10px; text-decoration:underline;" onclick="closeSettings()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content" style="border-color: var(--accent);">
            <div class="victory-text" id="winTitle">¡VICTORIA!</div>
            <div class="sub-victory-text" id="winSubtitle">XYM gana el Juego</div>
            <button class="btn-modal" id="winBtn" onclick="nextStep()">Continuar</button>
        </div>
    </div>

    <div class="modal" id="rankingModal">
        <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
            <h2>Clasificación</h2>
            
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
                <button class="btn-manual" id="btnFilterGlobal" style="height:auto; padding:5px 15px;" onclick="renderRanking('global')">Global</button>
                <button class="btn-manual" id="btnFilterAnual" style="height:auto; padding:5px 15px;" onclick="renderRanking('anual')">Anual</button>
                <button class="btn-manual" id="btnFilterDiario" style="height:auto; padding:5px 15px;" onclick="renderRanking('diario')">Diario</button>
            </div>

            <div style="margin-bottom: 15px; padding: 0 5px;">
                <input type="text" id="searchTeam" placeholder="🔍 Buscar equipo..." 
                       style="width: 100%; padding: 10px; border-radius: 8px; border: none; text-align: center; font-size: 1.1rem; background: rgba(255,255,255,0.1); color: white; outline: none;" 
                       oninput="renderRanking(currentFilter)" autocomplete="off">
            </div>

            <div id="rankingContent" style="overflow-y: auto; flex: 1; min-height: 150px; text-align: left;">
                </div>

            <button style="background:transparent; border:none; color:#aaa; margin-top:20px; text-decoration:underline; font-size:1.1rem;" onclick="closeRanking()">Cerrar</button>
        </div>
    </div>

<script>
    // ESTADO
    let state = {
        scores: { A: 0, B: 0 },
        games: { A: 0, B: 0 },
        vacas: { A: 0, B: 0 },
        pots: [0, 0, 0, 0], 
        activePhase: 0,
        config: {
            limit: 40,
            gamesToWinVaca: 3,
            vacasToWinMatch: 1
        }
    };

    let pendingAction = null; // Para manejar el flujo de modales

    // UI UPDATES
    function updateUI() {
        // Marcadores principales (Piedras)
        document.getElementById('scoreA').innerText = state.scores.A;
        document.getElementById('scoreB').innerText = state.scores.B;
        drawTokens('A', state.scores.A);
        drawTokens('B', state.scores.B);

        // Marcadores secundarios (Juegos y Vacas)
        document.getElementById('gamesA').innerText = state.games.A;
        document.getElementById('gamesB').innerText = state.games.B;
        document.getElementById('vacasA').innerText = state.vacas.A;
        document.getElementById('vacasB').innerText = state.vacas.B;

        // Botes
        state.pots.forEach((val, idx) => {
            const el = document.getElementById(`pot${idx}`);
            el.innerText = val === 0 ? '-' : val;
            
            const row = document.getElementById(`row${idx}`);
            if (idx === state.activePhase) row.classList.add('active');
            else row.classList.remove('active');

            const btns = row.querySelectorAll('.btn-award');
            btns.forEach(b => b.style.opacity = val > 0 ? '1' : '0.3');
        });

        // Verificar victoria de piedras inmediatamente
        checkPointsWin();
    }

    function drawTokens(team, score) {
        const container = document.getElementById(`tokens${team}`);
        container.innerHTML = '';
        const amarracos = Math.floor(score / 5);
        const piedras = score % 5;
        for(let i=0; i<amarracos; i++) container.innerHTML += `<div class="token amarraco"></div>`;
        for(let i=0; i<piedras; i++) container.innerHTML += `<div class="token piedra"></div>`;
    }

    // GAMEPLAY
    function selectPhase(idx) { state.activePhase = idx; updateUI(); }

    function addToActivePot(amount) {
        if (amount === -100) state.pots[state.activePhase] = 0;
        else state.pots[state.activePhase] += amount;
        updateUI();
    }

    function awardPot(phaseIdx, winnerTeam, event) {
        event.stopPropagation();
        const potValue = state.pots[phaseIdx];
        if (potValue === 0) return;

        state.scores[winnerTeam] += potValue;
        state.pots[phaseIdx] = 0;
        if (state.activePhase < 3) state.activePhase++;
        updateUI();
    }

    function manualAdd(team, amount) {
        state.scores[team] += amount;
        if (state.scores[team] < 0) state.scores[team] = 0;
        updateUI();
    }

    // WIN
    function checkPointsWin() {
        const nameA = document.getElementById('nameA').innerText;
        const nameB = document.getElementById('nameB').innerText;

        if (state.scores.A >= state.config.limit) triggerWinRound('A', nameA);
        else if (state.scores.B >= state.config.limit) triggerWinRound('B', nameB);
    }

    function triggerWinRound(team, name) {
        showModal(`¡JUEGO PARA ${name}!`, "Se anotan 1 punto de Juego", () => {
            // Continuar:
            state.scores.A = 0;
            state.scores.B = 0;
            state.games[team]++;
            state.pots = [0,0,0,0]; // Reset
            state.activePhase = 0;
            
            // Comprobar si gana la Vaca
            if (state.games[team] >= state.config.gamesToWinVaca) {
                triggerWinVaca(team, name);
            } else {
                updateUI(); // Sigue
            }
        });
    }

    function triggerWinVaca(team, name) {
        showModal(`¡VACA PARA ${name}!`, "Han ganado los juegos necesarios", () => {
            state.games.A = 0;
            state.games.B = 0;
            state.vacas[team]++;

            // Comprobar si gana la Partida
            if (state.vacas[team] >= state.config.vacasToWinMatch) {
                showModal(`¡VICTORIA FINAL!`, `¡${name} HAN GANADO LA PARTIDA!`, () => {
                    
                    registrarPartida(team);
                    
                }, "Guardar Resultado");
            } else {
                updateUI();
            }
        });
    }

    function showModal(title, subtitle, callback, btnText="Continuar") {
        document.getElementById('winTitle').innerText = title;
        document.getElementById('winSubtitle').innerText = subtitle;
        document.getElementById('winBtn').innerText = btnText;
        document.getElementById('winModal').style.display = 'flex';
        pendingAction = callback;
    }

    function nextStep() {
        document.getElementById('winModal').style.display = 'none';
        const actionToRun = pendingAction;
        pendingAction = null; 
        if (actionToRun) actionToRun();
    }

    // SETTINGS
    function openSettings() {
        document.getElementById('confLimit').value = state.config.limit;
        document.getElementById('confGames').value = state.config.gamesToWinVaca;
        document.getElementById('confVacas').value = state.config.vacasToWinMatch;
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
        state.config.limit = parseInt(document.getElementById('confLimit').value);
        state.config.gamesToWinVaca = parseInt(document.getElementById('confGames').value);
        state.config.vacasToWinMatch = parseInt(document.getElementById('confVacas').value);
        fullReset();
        closeSettings();
    }

    function fullReset() {
        state.scores = {A:0, B:0};
        state.games = {A:0, B:0};
        state.vacas = {A:0, B:0};
        state.pots = [0,0,0,0];
        state.activePhase = 0;
        updateUI();
    }

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyp6dfCyRKK_g5C_I0jvM1rsbfuLeNsZ-REyNpXgVcvFWPEQ7TH5QMfjo25BNFe9IoH/exec'; 

    function registrarPartida(winnerTeamId) {
        const btn = document.getElementById('winBtn');
        btn.innerText = "Guardando...";
        btn.disabled = true;

        const nameA = document.getElementById('nameA').innerText.trim();
        const nameB = document.getElementById('nameB').innerText.trim();
        
        const winner = winnerTeamId === 'A' ? nameA : nameB;
        const loser = winnerTeamId === 'A' ? nameB : nameA;
        const vacasWinner = state.vacas[winnerTeamId];
        const vacasLoser = winnerTeamId === 'A' ? state.vacas.B : state.vacas.A;

        const data = {
            ganador: winner,
            perdedor: loser,
            vacasGanador: vacasWinner,
            vacasPerdedor: vacasLoser
        };

        // Nueva petición blindada contra bloqueos CORS
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 
                'Content-Type': 'text/plain;charset=utf-8' 
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            btn.disabled = false;
            document.getElementById('winModal').style.display = 'none';
            alert("¡Partida registrada en el ranking!");
            fullReset();
        })
        .catch(error => {
            console.error('Error al guardar:', error);
            btn.disabled = false;
            btn.innerText = "Reintentar Guardado";
            alert("Sigue fallando. Revisa la URL y los permisos de Google.");
        });
    }

    // --- SISTEMA DE RANKING ---
    let globalRankingData = []; 
    let currentFilter = 'global'; // Guardamos el filtro activo para el buscador

    async function loadRanking() {
        document.getElementById('rankingContent').innerHTML = "<div style='text-align:center; padding:20px; color:#aaa;'>Cargando datos...</div>";
        document.getElementById('rankingModal').style.display = 'flex';
        document.getElementById('searchTeam').value = ''; // Limpiar el buscador al abrir
        
        try {
            const response = await fetch(SCRIPT_URL); 
            const data = await response.json();
            
            globalRankingData = data; 
            renderRanking('global'); // Por defecto cargamos el histórico
        } catch (error) {
            console.error(error);
            document.getElementById('rankingContent').innerHTML = "<div style='text-align:center; color:#ef5350;'>Error al cargar los datos.</div>";
        }
    }

    function renderRanking(filter) {
        currentFilter = filter; // Actualizamos el estado
        
        // Estilos de los botones
        document.getElementById('btnFilterGlobal').style.borderColor = filter === 'global' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterGlobal').style.color = filter === 'global' ? 'var(--accent)' : '#aaa';
        
        document.getElementById('btnFilterAnual').style.borderColor = filter === 'anual' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterAnual').style.color = filter === 'anual' ? 'var(--accent)' : '#aaa';

        document.getElementById('btnFilterDiario').style.borderColor = filter === 'diario' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterDiario').style.color = filter === 'diario' ? 'var(--accent)' : '#aaa';

        let filteredData = globalRankingData;
        const now = new Date();
        
        // Filtrado por Fecha (Anual o Diario)
        if (filter === 'anual') {
            const currentYear = now.getFullYear().toString();
            filteredData = filteredData.filter(row => row[0].includes(currentYear));
        } else if (filter === 'diario') {
            // Creamos los números de hoy
            const d = now.getDate();
            const m = now.getMonth() + 1;
            const y = now.getFullYear();
            
            // Cubrimos todas las posibilidades que Google y los navegadores pueden generar
            const format1 = `${d}/${m}/${y}`; // Ej: 26/6/2026
            const format2 = `${d.toString().padStart(2, '0')}/${m.toString().padStart(2, '0')}/${y}`; // Ej: 26/06/2026
            const formatISO = `${y}-${m.toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`; // Ej: 2026-06-26T...
            
            filteredData = filteredData.filter(row => {
                if (!row[0]) return false;
                const dateStr = String(row[0]);
                // Si la fecha del Excel empieza por cualquiera de los 3 formatos, es de hoy
                return dateStr.startsWith(format1) || dateStr.startsWith(format2) || dateStr.startsWith(formatISO);
            });
        }
        
        // Diccionario para contar estadísticas
        const stats = {};
        
        filteredData.forEach(row => {
            const [fecha, ganador, perdedor, vacasGanador, vacasPerdedor] = row;
            if(!ganador) return; 
            
            if (!stats[ganador]) stats[ganador] = { victorias: 0, derrotas: 0, vacas: 0 };
            if (!stats[perdedor]) stats[perdedor] = { victorias: 0, derrotas: 0, vacas: 0 };
            
            stats[ganador].victorias++;
            stats[ganador].vacas += parseInt(vacasGanador) || 0;
            
            stats[perdedor].derrotas++;
            stats[perdedor].vacas += parseInt(vacasPerdedor) || 0;
        });
        
        // Leemos el texto del buscador y lo pasamos a minúsculas para que no sea sensible a mayúsculas
        const searchTerm = document.getElementById('searchTeam').value.toLowerCase();
        
        // Convertimos a array, aplicamos el buscador y ordenamos
        const sortedTeams = Object.keys(stats)
            .filter(team => team.toLowerCase().includes(searchTerm)) // Filtro del buscador
            .sort((a, b) => {
                if (stats[b].victorias !== stats[a].victorias) return stats[b].victorias - stats[a].victorias;
                return stats[b].vacas - stats[a].vacas; // Desempate por vacas
            });
        
        // Construimos la tabla visual
        let html = `
            <table style="width:100%; border-collapse: collapse; font-size: 1.1rem;">
                <tr style="border-bottom: 2px solid #546e7a; color:var(--accent);">
                    <th style="padding:10px 5px; text-align:left;">Equipo</th>
                    <th style="padding:10px 5px; text-align:center;">V</th>
                    <th style="padding:10px 5px; text-align:center;">D</th>
                </tr>
        `;
        
        sortedTeams.forEach((team, index) => {
            // Las medallas solo tienen sentido si no estás buscando nada específico
            let medal = (index === 0 && searchTerm === '') ? '🥇 ' : 
                        (index === 1 && searchTerm === '') ? '🥈 ' : 
                        (index === 2 && searchTerm === '') ? '🥉 ' : 
                        `<span style="opacity:0.5">${index+1}.</span> `;
            
            html += `
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <td style="padding:12px 5px; word-break: break-all;">${medal} ${team}</td>
                    <td style="padding:12px 5px; text-align:center; font-weight:bold; color:#81c784;">${stats[team].victorias}</td>
                    <td style="padding:12px 5px; text-align:center; color:#e57373;">${stats[team].derrotas}</td>
                </tr>
            `;
        });
        html += `</table>`;
        
        if (sortedTeams.length === 0) {
            html = `<div style="text-align:center; padding:30px 10px; color:#aaa;">No se encontraron resultados para esta búsqueda o fecha.</div>`;
        }
        
        document.getElementById('rankingContent').innerHTML = html;
    }

    function closeRanking() {
        document.getElementById('rankingModal').style.display = 'none';
    }

    // INIT
    updateUI();

</script>
</body>
</html>
