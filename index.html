<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MusMaho</title>
    <style>
        :root {
            --bg-color: #1b5e20;
            --panel-bg: rgba(0,0,0,0.3);
            --team-a: #42a5f5;
            --team-b: #ffca28;
            --accent: #ffeb3b;
            --text: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Alineado arriba para dar espacio a los sub-marcadores */
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            height: 18vh;
            min-height: 110px;
            z-index: 1; /* Por encima del fondo fijo .leopard-bg */
        }
        
        .global-score-box {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 40%;
        }
        
        .score-num { font-size: 2.8rem; font-weight: bold; min-width: 50px; text-align: center; line-height: 1;}
        
        .team-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .team-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            cursor: text;
            margin-bottom: 5px;
        }

        /* Contadores de Vacas y Juegos */
        .sub-scores {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .sub-badge {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Area de fichas visuales */
        .tokens-area {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
            height: 24px;
        }
        
        .token { width: 14px; height: 14px; border-radius: 50%; box-shadow: 1px 1px 2px black; }
        .token.amarraco { background: gold; border: 2px solid #b8860b; width: 18px; height: 18px; }
        .token.piedra { background: white; border: 1px solid #999; }

        /* Botón de Ajustes Central 
            font-size: 1.5rem;
            opacity: 0.7;
            cursor: pointer;
            padding: 10px;
            margin-top: 5px;
        }*/

        /* MAIN: Tablero de Control */
        .main-board {
            flex: 1;
            display: grid;
            grid-template-columns: 80px 1fr 80px; 
            gap: 5px;
            padding: 5px;
            z-index: 1; /* Por encima del fondo fijo .leopard-bg */
        }

        /* Columnas laterales */
        .side-panel { display: flex; flex-direction: column; justify-content: space-around; }

        .btn-manual {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            height: 18%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-manual:active { background: rgba(255,255,255,0.4); }

        /* Columna Central */
        .phases-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 5px;
        }

        .phase-row {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            height: 23%;
            padding: 0 5px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .phase-row.active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent);
        }

        .phase-name { font-size: 0.9rem; width: 60px; font-weight: 600; opacity: 0.8; }
        .phase-pot { flex: 1; text-align: center; font-size: 2rem; color: var(--accent); font-weight: bold; }
        .btn-award { background: none; border: none; color: white; font-size: 1.5rem; padding: 0 15px; cursor: pointer; opacity: 0.6; }

        /* FOOTER PARA MÓVIL */
        .betting-controls {
            height: auto; 
            min-height: 18vh;
            background: rgba(0,0,0,0.9);
            
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            
            border-top: 2px solid var(--accent);
            /* Importante para iPhone X y móviles modernos (zona segura abajo) */
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 1; /* Por encima del fondo fijo .leopard-bg */
        }

        .bet-btn {
            background: #3e2723;
            color: var(--accent);
            border: 1px solid var(--accent);
            
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
            max-width: none;
        }
        
        .bet-btn:active {
            background: var(--accent);
            color: black;
            transform: scale(0.98);
        }

        /* Estilos específicos para botones especiales */
        .btn-borrar {
            background: #5d4037; 
            color: #ffcccb; 
            border-color: #8d6e63;
            font-size: 1rem;
        }
        
        .btn-ordago {
            grid-column: span 2;
            background: linear-gradient(45deg, #b71c1c, #d32f2f);
            color: white;
            border: 2px solid red;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MODALES (Ajustes y Victoria) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: #263238;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #546e7a;
        }

        .modal h2 { margin-top: 0; color: var(--accent); }
        
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .config-input {
            width: 60px;
            padding: 5px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 5px;
            border: none;
        }

        .btn-modal {
            background: var(--team-a);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }

        .victory-text { font-size: 2rem; margin-bottom: 20px; font-weight: bold; color: var(--accent); }
        .sub-victory-text { font-size: 1.2rem; color: white; margin-bottom: 30px; }

        /* LEOPARDO */
        body.theme-alba {
            --accent: #ff9800; 
            --team-a: #ffcc80;
            --team-b: #ffb74d;
            background-color: #d9a75f; /* respaldo mientras carga el SVG */
            transition: background-color 0.5s ease;
        }

        /* Fondo de rosetas de leopardo: SVG inline fijo detrás de toda la UI */
        .leopard-bg {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        body.theme-alba .leopard-bg { display: block; }

        /* Contraste */
        body.theme-alba .header,
        body.theme-alba .betting-controls,
        body.theme-alba .phases-container,
        body.theme-alba .modal-content {
            background: rgba(10, 5, 0, 0.35); 
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
            border-color: #ff9800;
            backdrop-filter: blur(2.5px); /* Desenfoque sutil del fondo para potenciar la lectura */
            -webkit-backdrop-filter: blur(2.5px); /* Soporte para iOS */
        }

        body.theme-alba .phase-row.active {
            background: rgba(255, 152, 0, 0.15);
            border-color: #ff9800;
        }

        body.theme-alba .btn-manual {
            background: rgba(20, 10, 0, 0.65); /* Fondo semitransparente oscuro */
            border-color: rgba(255, 152, 0, 0.4);
            text-shadow: 1px 1px 3px black; /* Sombra en el texto para que salte a la vista */
        }
        
        body.theme-alba .btn-manual:active {
            background: rgba(255, 152, 0, 0.3);
        }
        
        /* Ajuste oscuro para los botones inferiores */
        body.theme-alba .bet-btn {
            background: rgba(20, 10, 0, 0.4);
        }
        
        body.theme-alba .btn-borrar {
            background: #4a1c1c; 
            color: #ff8a80;
        }

    </style>
</head>

                <span style="font-size: 1rem;">Jugador 2:</span>
                <input type="text" id="player2Input" list="playersList" class="config-input" style="width: 160px; text-align:left; background: rgba(255,255,255,0.1); color: white;" placeholder="Opcional...">
            </div>

            <button class="btn-modal" onclick="saveTeam()">Guardar Equipo</button>

<script>
    // ESTADO
    let state = {
        scores: { A: 0, B: 0 },
        games: { A: 0, B: 0 },
        vacas: { A: 0, B: 0 },
        pots: [0, 0, 0, 0], 
        activePhase: 0,
        config: {
            limit: 40,
            gamesToWinVaca: 3,
            vacasToWinMatch: 1
        }
    };

    let pendingAction = null; // Para manejar el flujo de modales

    // Leopardo detect
    function checkAlbaTheme() {
        const nameA = document.getElementById('nameA').innerText.toUpperCase();
        const nameB = document.getElementById('nameB').innerText.toUpperCase();
        
        if (nameA.includes('ALBA') || nameB.includes('ALBA')) {
            document.body.classList.add('theme-alba');
        } else {
            document.body.classList.remove('theme-alba');
        }
    }

    // --- GESTIÓN DE EQUIPOS Y JUGADORES ---
    let editingTeam = 'A';
    let allPlayers = new Set();
    let currentMode = 'equipos'; // 'equipos' o 'jugadores'

    const isDefault = (name) => {
        if (!name) return true;
        const cleanName = String(name).trim().toUpperCase();
        return cleanName === 'XYM' || cleanName === 'MAHO' || cleanName === 'EQ. A' || cleanName === 'EQ. B';
    };

    // Extrae jugadores únicos del Excel para llenar el desplegable
    function updatePlayersList(data) {
        allPlayers.clear();
        data.forEach(row => {
            const ganadores = row[1] ? String(row[1]).split(' - ') : [];
            const perdedores = row[2] ? String(row[2]).split(' - ') : [];
            ganadores.forEach(p => { if(p && !isDefault(p)) allPlayers.add(p.trim()) });
            perdedores.forEach(p => { if(p && !isDefault(p)) allPlayers.add(p.trim()) });
        });
        
        const datalist = document.getElementById('playersList');
        datalist.innerHTML = '';
        Array.from(allPlayers).sort().forEach(player => {
            const option = document.createElement('option');
            option.value = player;
            datalist.appendChild(option);
        });
    }

    function openTeamModal(team) {
        editingTeam = team;
        document.getElementById('teamModalTitle').innerText = `Configurar Equipo ${team}`;
        
        const currentName = document.getElementById(`name${team}`).innerText;
        const parts = currentName.split(' - ');
        
        document.getElementById('player1Input').value = isDefault(parts[0]) ? '' : parts[0];
        document.getElementById('player2Input').value = parts[1] || '';
        
        document.getElementById('teamModal').style.display = 'flex';
    }

    function closeTeamModal() {
        document.getElementById('teamModal').style.display = 'none';
    }

    function saveTeam() {
        const p1 = document.getElementById('player1Input').value.trim();
        const p2 = document.getElementById('player2Input').value.trim();
        
        let finalName = '';
        
        if (p1 && p2) {
            // Metemos los nombres en un array y los ordenamos alfabéticamente
            // localeCompare ayuda a ordenar bien sin importar mayúsculas o tildes
            const players = [p1, p2].sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
            finalName = `${players[0]} - ${players[1]}`;
        }
        else if (p1) finalName = p1;
        else if (p2) finalName = p2;
        else finalName = `Eq. ${editingTeam}`;

        document.getElementById(`name${editingTeam}`).innerText = finalName;
        closeTeamModal();

        checkAlbaTheme();
    }

    function setRankingMode(mode) {
        currentMode = mode;
        // Actualizar estilos visuales de los botones
        document.getElementById('btnModeEquipos').style.borderColor = mode === 'equipos' ? 'var(--accent)' : '#555';
        document.getElementById('btnModeEquipos').style.color = mode === 'equipos' ? 'var(--accent)' : '#aaa';
        document.getElementById('btnModeJugadores').style.borderColor = mode === 'jugadores' ? 'var(--accent)' : '#555';
        document.getElementById('btnModeJugadores').style.color = mode === 'jugadores' ? 'var(--accent)' : '#aaa';
        
        renderRanking(currentFilter);
    }

    // UI UPDATES
    function updateUI() {
        // Marcadores principales (Piedras)
        document.getElementById('scoreA').innerText = state.scores.A;
        document.getElementById('scoreB').innerText = state.scores.B;
        drawTokens('A', state.scores.A);
        drawTokens('B', state.scores.B);

        // Marcadores secundarios (Juegos y Vacas)
        document.getElementById('gamesA').innerText = state.games.A;
        document.getElementById('gamesB').innerText = state.games.B;
        document.getElementById('vacasA').innerText = state.vacas.A;
        document.getElementById('vacasB').innerText = state.vacas.B;

        // Botes
        state.pots.forEach((val, idx) => {
            const el = document.getElementById(`pot${idx}`);
            el.innerText = val === 0 ? '-' : val;
            
            const row = document.getElementById(`row${idx}`);
            if (idx === state.activePhase) row.classList.add('active');
            else row.classList.remove('active');

            const btns = row.querySelectorAll('.btn-award');
            btns.forEach(b => b.style.opacity = val > 0 ? '1' : '0.3');
        });

        // Verificar victoria de piedras inmediatamente
        checkPointsWin();
    }

    function editScore(type, team) {
        const isVaca = (type === 'vacas');
        const typeName = isVaca ? 'Vacas' : 'Juegos';
        const teamName = document.getElementById(`name${team}`).innerText;
        
        // Leemos el valor actual para sugerirlo en la ventana
        const currentVal = isVaca ? state.vacas[team] : state.games[team];
        
        // Abrimos el popup nativo del sistema
        const newVal = prompt(`Editar ${typeName} de ${teamName}:`, currentVal);
        
        // Si no han cancelado y han escrito un número válido...
        if (newVal !== null && newVal.trim() !== "" && !isNaN(newVal)) {
            const numVal = parseInt(newVal);
            
            // Actualizamos el estado interno
            if (isVaca) {
                state.vacas[team] = numVal;
            } else {
                state.games[team] = numVal;
            }
            
            // Refrescamos la pantalla
            updateUI();
            
            // Pequeño seguro: Si al editar los juegos le ponen los necesarios para ganar, disparamos la victoria
            if (!isVaca && state.games[team] >= state.config.gamesToWinVaca) {
                triggerWinVaca(team, teamName);
            }
        }
    }

    function drawTokens(team, score) {
        const container = document.getElementById(`tokens${team}`);
        container.innerHTML = '';
        const amarracos = Math.floor(score / 5);
        const piedras = score % 5;
        for(let i=0; i<amarracos; i++) container.innerHTML += `<div class="token amarraco"></div>`;
        for(let i=0; i<piedras; i++) container.innerHTML += `<div class="token piedra"></div>`;
    }

    // GAMEPLAY
    function selectPhase(idx) { state.activePhase = idx; updateUI(); }

    function addToActivePot(amount) {
        if (amount === -100) state.pots[state.activePhase] = 0;
        else state.pots[state.activePhase] += amount;
        updateUI();
    }

    function awardPot(phaseIdx, winnerTeam, event) {
        event.stopPropagation();
        const potValue = state.pots[phaseIdx];
        if (potValue === 0) return;

        state.scores[winnerTeam] += potValue;
        state.pots[phaseIdx] = 0;
        if (state.activePhase < 3) state.activePhase++;
        updateUI();
    }

    function manualAdd(team, amount) {
        state.scores[team] += amount;
        if (state.scores[team] < 0) state.scores[team] = 0;
        updateUI();
    }

    // WIN
    function checkPointsWin() {
        const nameA = document.getElementById('nameA').innerText;
        const nameB = document.getElementById('nameB').innerText;

        if (state.scores.A >= state.config.limit) triggerWinRound('A', nameA);
        else if (state.scores.B >= state.config.limit) triggerWinRound('B', nameB);
    }

    function triggerWinRound(team, name) {
        showModal(`¡JUEGO PARA ${name}!`, "Se anotan 1 punto de Juego", () => {
            // Continuar:
            state.scores.A = 0;
            state.scores.B = 0;
            state.games[team]++;
            state.pots = [0,0,0,0]; // Reset
            state.activePhase = 0;
            
            // Comprobar si gana la Vaca
            if (state.games[team] >= state.config.gamesToWinVaca) {
                triggerWinVaca(team, name);
            } else {
                updateUI(); // Sigue
            }
        });
    }

    function triggerWinVaca(team, name) {
        // MAGIA AQUÍ: Calculamos los juegos exactos justo antes de resetearlos.
        // Fórmula: Juegos actuales en el marcador + (Vacas que ya tenían * Juegos por vaca)
        const juegosA_totales = state.games.A + (state.vacas.A * state.config.gamesToWinVaca);
        const juegosB_totales = state.games.B + (state.vacas.B * state.config.gamesToWinVaca);

        showModal(`¡VACA PARA ${name}!`, "Han ganado los juegos necesarios", () => {
            state.games.A = 0;
            state.games.B = 0;
            state.vacas[team]++;

            // Comprobar si gana la Partida
            if (state.vacas[team] >= state.config.vacasToWinMatch) {
                showModal(`¡VICTORIA FINAL!`, `¡${name} HAN GANADO LA PARTIDA!`, () => {
                    
                    // Le enviamos a la base de datos la "foto" de los juegos que tomamos arriba
                    registrarPartida(team, juegosA_totales, juegosB_totales);
                    
                }, "Guardar Resultado");
            } else {
                updateUI();
            }
        });
    }

    function showModal(title, subtitle, callback, btnText="Continuar") {
        document.getElementById('winTitle').innerText = title;
        document.getElementById('winSubtitle').innerText = subtitle;
        document.getElementById('winBtn').innerText = btnText;
        document.getElementById('winModal').style.display = 'flex';
        pendingAction = callback;
    }

    function nextStep() {
        document.getElementById('winModal').style.display = 'none';
        const actionToRun = pendingAction;
        pendingAction = null; 
        if (actionToRun) actionToRun();
    }

    // SETTINGS
    function openSettings() {
        document.getElementById('confLimit').value = state.config.limit;
        document.getElementById('confGames').value = state.config.gamesToWinVaca;
        document.getElementById('confVacas').value = state.config.vacasToWinMatch;
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
        state.config.limit = parseInt(document.getElementById('confLimit').value);
        state.config.gamesToWinVaca = parseInt(document.getElementById('confGames').value);
        state.config.vacasToWinMatch = parseInt(document.getElementById('confVacas').value);
        fullReset();
        closeSettings();
    }

    function fullReset() {
        state.scores = {A:0, B:0};
        state.games = {A:0, B:0};
        state.vacas = {A:0, B:0};
        state.pots = [0,0,0,0];
        state.activePhase = 0;
        updateUI();
    }

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytJK-XTQKNS_6u31DhQDXfvV4SNd3TgXF53RhAlTJTlw4L1xH94oN5jtcThMMPGso/exec'; 

    function registrarPartida(winnerTeamId, totalGamesA, totalGamesB) {
        const btn = document.getElementById('winBtn');
        btn.innerText = "Guardando...";
        btn.disabled = true;

        const nameA = document.getElementById('nameA').innerText.trim();
        const nameB = document.getElementById('nameB').innerText.trim();
        
        const winner = winnerTeamId === 'A' ? nameA : nameB;
        const loser = winnerTeamId === 'A' ? nameB : nameA;
        const vacasWinner = state.vacas[winnerTeamId];
        const vacasLoser = winnerTeamId === 'A' ? state.vacas.B : state.vacas.A;

        // Asignamos los juegos según quién haya ganado
        const juegosWinner = winnerTeamId === 'A' ? totalGamesA : totalGamesB;
        const juegosLoser = winnerTeamId === 'A' ? totalGamesB : totalGamesA;

        const data = {
            ganador: winner,
            perdedor: loser,
            vacasGanador: vacasWinner,
            vacasPerdedor: vacasLoser,
            juegosGanador: juegosWinner, // Enviamos los juegos
            juegosPerdedor: juegosLoser  // Enviamos los juegos
        };

        // Nueva petición blindada contra bloqueos CORS
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 
                'Content-Type': 'text/plain;charset=utf-8' 
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            btn.disabled = false;
            document.getElementById('winModal').style.display = 'none';
            alert("¡Partida registrada en el ranking!");
            fullReset();
        })
        .catch(error => {
            console.error('Error al guardar:', error);
            btn.disabled = false;
            btn.innerText = "Reintentar Guardado";
            alert("Sigue fallando. Revisa la URL y los permisos de Google.");
        });
    }

    // RANKING
    let globalRankingData = []; 
    let currentFilter = 'global';
    let minGamesFilter = 7;

    function updateMinGames() {
        const inputVal = document.getElementById('minGamesInput').value;
        minGamesFilter = inputVal === "" ? 0 : parseInt(inputVal);
        renderRanking(currentFilter);
    }

    async function loadRanking() {
        document.getElementById('rankingContent').innerHTML = "<div style='text-align:center; padding:20px; color:#aaa;'>Cargando datos...</div>";
        document.getElementById('rankingModal').style.display = 'flex';
        document.getElementById('searchTeam').value = ''; // Limpiar el buscador al abrir
        
        try {
            const response = await fetch(SCRIPT_URL); 
            const data = await response.json();
            
            globalRankingData = data; 
            renderRanking('global');
        } catch (error) {
            console.error(error);
            document.getElementById('rankingContent').innerHTML = "<div style='text-align:center; color:#ef5350;'>Error al cargar los datos.</div>";
        }
    }

    function renderRanking(filter) {
        currentFilter = filter; 
        
        // Estilos de los botones
        document.getElementById('btnFilterGlobal').style.borderColor = filter === 'global' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterGlobal').style.color = filter === 'global' ? 'var(--accent)' : '#aaa';
        
        document.getElementById('btnFilterAnual').style.borderColor = filter === 'anual' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterAnual').style.color = filter === 'anual' ? 'var(--accent)' : '#aaa';

        document.getElementById('btnFilterDiario').style.borderColor = filter === 'diario' ? 'var(--accent)' : '#555';
        document.getElementById('btnFilterDiario').style.color = filter === 'diario' ? 'var(--accent)' : '#aaa';

        let filteredData = globalRankingData;
        const now = new Date();
        
        // Filtrado por Fecha (Anual o Diario)
        if (filter === 'anual') {
            const currentYear = now.getFullYear().toString();
            filteredData = filteredData.filter(row => row[0].includes(currentYear));
        } else if (filter === 'diario') {
            // Creamos los números de hoy
            const d = now.getDate();
            const m = now.getMonth() + 1;
            const y = now.getFullYear();
            
            // Cubrimos todas las posibilidades que Google y los navegadores pueden generar
            const format1 = `${d}/${m}/${y}`; // Ej: 26/6/2026
            const format2 = `${d.toString().padStart(2, '0')}/${m.toString().padStart(2, '0')}/${y}`; // Ej: 26/06/2026
            const formatISO = `${y}-${m.toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`; // Ej: 2026-06-26T...
            
            filteredData = filteredData.filter(row => {
                if (!row[0]) return false;
                const dateStr = String(row[0]);
                // Si la fecha del Excel empieza por cualquiera de los 3 formatos, es de hoy
                return dateStr.startsWith(format1) || dateStr.startsWith(format2) || dateStr.startsWith(formatISO);
            });
        }
        
        // Diccionario para contar estadísticas
        const stats = {};

        filteredData.forEach(row => {
            // Añadimos juegosGanador y juegosPerdedor a la lectura de la fila
            const [fecha, ganador, perdedor, vacasGanador, vacasPerdedor, juegosGanador, juegosPerdedor] = row;
            if(!ganador) return; 

            let ganadoresArray = currentMode === 'jugadores' ? String(ganador).split(' - ') : [ganador];
            let perdedoresArray = currentMode === 'jugadores' ? String(perdedor).split(' - ') : [perdedor];

            ganadoresArray.forEach(p => {
                const entity = String(p).trim();
                if (!isDefault(entity)) {
                    if (!stats[entity]) stats[entity] = { victorias: 0, derrotas: 0, vacas: 0, juegos: 0, racha: 0, rachaRota: false };
                    stats[entity].victorias++;
                    stats[entity].vacas += parseInt(vacasGanador) || 0;
                    stats[entity].juegos += parseInt(juegosGanador) || 0; // Sumamos los juegos
                }
            });

            perdedoresArray.forEach(p => {
                const entity = String(p).trim();
                if (!isDefault(entity)) {
                    if (!stats[entity]) stats[entity] = { victorias: 0, derrotas: 0, vacas: 0, juegos: 0, racha: 0, rachaRota: false };
                    stats[entity].derrotas++;
                    stats[entity].vacas += parseInt(vacasPerdedor) || 0;
                    stats[entity].juegos += parseInt(juegosPerdedor) || 0; // Sumamos los juegos
                }
            });
        });

        for (let i = filteredData.length - 1; i >= 0; i--) {
            const [fecha, ganador, perdedor] = filteredData[i];
            if (!ganador) continue;

            let ganadoresArray = currentMode === 'jugadores' ? String(ganador).split(' - ') : [ganador];
            let perdedoresArray = currentMode === 'jugadores' ? String(perdedor).split(' - ') : [perdedor];

            ganadoresArray.forEach(p => {
                const entity = String(p).trim();
                // Si ha ganado y su racha aún no se ha roto, sumamos 1
                if (!isDefault(entity) && stats[entity] && !stats[entity].rachaRota) {
                    stats[entity].racha++;
                }
            });

            perdedoresArray.forEach(p => {
                const entity = String(p).trim();
                // Si encontramos una derrota en el historial, cortamos la racha
                if (!isDefault(entity) && stats[entity]) {
                    stats[entity].rachaRota = true;
                }
            });
        }
        
        // 1. Calculamos el Winrate para cada jugador antes de ordenar
        Object.keys(stats).forEach(team => {
            const totalPartidas = stats[team].victorias + stats[team].derrotas;
            // Evitamos divisiones por cero. Winrate = (Victorias / Partidas Totales) * 100
            stats[team].winrate = totalPartidas > 0 ? (stats[team].victorias / totalPartidas) * 100 : 0;
            stats[team].totalPartidas = totalPartidas;
        });

        const searchTerm = document.getElementById('searchTeam').value.toLowerCase();
        
        // 2. Filtramos por el mínimo de partidas y ordenamos por Winrate
        const sortedTeams = Object.keys(stats)
            .filter(team => {
                // Comprobamos si coincide con la barra de búsqueda
                const matchesSearch = team.toLowerCase().includes(searchTerm);
                // Comprobamos si tiene las partidas mínimas exigidas en el input
                const meetsMinGames = stats[team].totalPartidas >= minGamesFilter;
                
                return matchesSearch && meetsMinGames;
            })
            .sort((a, b) => {
                // WR
                if (stats[b].winrate !== stats[a].winrate) return stats[b].winrate - stats[a].winrate; // 1. Mayor % de victoria
                if (stats[b].totalPartidas !== stats[a].totalPartidas) return stats[b].totalPartidas - stats[a].totalPartidas; // 2. Más partidas (constancia)
                return stats[b].victorias - stats[a].victorias; // 3. Más victorias totales
            });
        
        // 4. Construimos la tabla incluyendo la columna de %
        let html = `
            <table style="width:100%; border-collapse: collapse; font-size: 1rem;">
                <tr style="border-bottom: 2px solid #546e7a; color:var(--accent);">
                    <th style="padding:10px 2px; text-align:left;">Nombre</th>
                    <th style="padding:10px 2px; text-align:center;">V</th>
                    <th style="padding:10px 2px; text-align:center;">D</th>
                    <th style="padding:10px 2px; text-align:center;">J</th>
                    <th style="padding:10px 2px; text-align:center;">%</th>
                </tr>
        `;
        
        sortedTeams.forEach((team, index) => {
            let medal = (index === 0 && searchTerm === '') ? '🥇 ' : 
                        (index === 1 && searchTerm === '') ? '🥈 ' : 
                        (index === 2 && searchTerm === '') ? '🥉 ' : 
                        `<span style="opacity:0.5">${index+1}.</span> `;
            
            let nombreVisual = team;
            let estiloNombre = "padding:12px 2px; word-break: break-all;";
            
            if (stats[team].racha >= 3) {
                nombreVisual += ` <span style="font-size:0.9rem;">🔥${stats[team].racha}</span>`;
                estiloNombre += " color: #ff5252; font-weight: bold;";
            }
            
            html += `
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <td style="${estiloNombre}">${medal} ${nombreVisual}</td>
                    <td style="padding:12px 2px; text-align:center; font-weight:bold; color:#81c784;">${stats[team].victorias}</td>
                    <td style="padding:12px 2px; text-align:center; color:#e57373;">${stats[team].derrotas}</td>
                    <td style="padding:12px 2px; text-align:center; color:#42a5f5;">${stats[team].juegos}</td>
                    <td style="padding:12px 2px; text-align:center; color:var(--accent);">${stats[team].winrate.toFixed(0)}%</td>
                </tr>
            `;
        });
        html += `</table>`;
        
        if (sortedTeams.length === 0) {
            html = `<div style="text-align:center; padding:30px 10px; color:#aaa;">No se encontraron resultados para esta búsqueda o fecha.</div>`;
        }
        
        document.getElementById('rankingContent').innerHTML = html;
    }

    function closeRanking() {
        document.getElementById('rankingModal').style.display = 'none';
    }

    // INIT
    updateUI();
    checkAlbaTheme();

    // Descarga silenciosa para tener los nombres listos en el autocompletado
    fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            globalRankingData = data;
            updatePlayersList(data);
        }).catch(e => console.log("Carga silenciosa fallida, requiere internet."));

</script>
